# Example: run the exporter next to llama-swap on the same Docker network.
# llama-swap's container name and port below are placeholders; adjust to your setup.
services:
  llamaswap-exporter:
    build: ..
    container_name: llamaswap-exporter
    restart: unless-stopped
    environment:
      LLAMASWAP_URL: http://llama-swap:8080
      # LLAMASWAP_API_KEY: ...          # only if llama-swap has apiKeys configured
      POLL_INTERVAL: "15"
      ACTIVITY_LIMIT: "200"
    ports:
      - "127.0.0.1:9105:9105"           # or drop this and let Prometheus scrape it on the Docker network
    mem_limit: 128m
    networks:
      - llm

networks:
  llm:
    external: true                      # the network llama-swap is on
