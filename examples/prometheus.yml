scrape_configs:
  - job_name: llamaswap-exporter        # per-request metrics from this exporter
    static_configs:
      - targets: ["llamaswap-exporter:9105"]
  - job_name: llama-swap                # llama-swap's own /metrics: CPU, memory, GPU
    static_configs:
      - targets: ["llama-swap:8080"]
